# Caminho da ontologia dentro do classpath (src/main/resources)
sicap.ontology.path=ontology/sicap-contabil.owl

# Namespace base da ontologia (mesmo do arquivo .owl)
sicap.ontology.namespace=http://www.unitins.br/ontologias/sicap-contabil#

quarkus.http.port=8080

# Qual provedor de LLM usar: "openai", "gemini", "grok" ou "ollama".
# Troque aqui pra alternar entre os modelos sem mexer em código.
llm.provider=ollama

# --- OpenAI (GPT) ---
# A chave NUNCA fica no código/arquivo versionado - vem da variável de
# ambiente OPENAI_API_KEY.
openai.api.key=${OPENAI_API_KEY:}
openai.model=gpt-4o-mini
openai.api.url=https://api.openai.com/v1/chat/completions

# --- Google Gemini ---
# Chave gerada em https://aistudio.google.com/app/apikey (grátis, sem cartão).
# Vem da variável de ambiente GEMINI_API_KEY.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-3.5-flash-lite
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# --- Grok (xAI) ---
# Chave gerada em https://console.x.ai. Vem da variável de ambiente GROK_API_KEY.
grok.api.key=${GROK_API_KEY:}
grok.model=grok-4.5
grok.api.url=https://api.x.ai/v1/chat/completions

# --- Ollama (local, LLaMA/Mistral - grátis, sem chave) ---
# Troque ollama.model pra "mistral" pra testar o outro modelo open-source
# citado no TCC, sem mexer em mais nada.
ollama.model=llama3.2
ollama.api.url=http://localhost:11434/api/chat
# Temperatura baixa = respostas mais "factuais"/conservadoras, menos
# propensas a alucinação. Padrão da API do Ollama sem isso seria 0.8.
ollama.temperature=0.2

# Lista de regras existentes na ontologia (escopo da prova de conceito).
# Usada no PromptService como guardrail anti-alucinação.
sicap.regras.validas=BV3, BV29, BV32

# Log mais detalhado durante o desenvolvimento
quarkus.log.level=INFO
quarkus.log.category."br.edu.unitins.sicap".level=DEBUG