# Caminho da ontologia dentro do classpath (src/main/resources)
sicap.ontology.path=ontology/sicap-contabil.owl

# Namespace base da ontologia (mesmo do arquivo .owl)
sicap.ontology.namespace=http://www.unitins.br/ontologias/sicap-contabil#

quarkus.http.port=8080

# Qual provedor de LLM usar: "openai" ou "gemini".
# Troque aqui pra alternar entre os modelos sem mexer em código.
llm.provider=gemini

# --- OpenAI (GPT) ---
# A chave NUNCA fica no código/arquivo versionado - vem da variável de
# ambiente OPENAI_API_KEY.
openai.api.key=${OPENAI_API_KEY:}
openai.model=gpt-4o-mini
openai.api.url=https://api.openai.com/v1/chat/completions

# --- Google Gemini ---
# Chave gerada em https://aistudio.google.com/app/apikey (grátis, sem cartão).
# Vem da variável de ambiente GEMINI_API_KEY.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-3.5-flash-lite
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# Log mais detalhado durante o desenvolvimento
quarkus.log.level=INFO
quarkus.log.category."br.edu.unitins.sicap".level=DEBUG
